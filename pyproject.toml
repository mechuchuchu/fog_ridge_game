[project]
name = "fog-ridge"
version = "0.1.0"
description = "Event-driven optimization game research simulator"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "torch>=2.6",
]

[project.scripts]
fog-ridge = "fog_ridge.cli:main"
fog-ridge-train = "fog_ridge.ppo:main"
fog-ridge-mappo = "fog_ridge.mappo:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
